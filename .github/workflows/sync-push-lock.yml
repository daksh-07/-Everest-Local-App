name: Sync push dependency lock

on:
  push:
    branches:
      - everest-live-push-alerts
    paths:
      - package.json
      - .github/workflows/sync-push-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: everest-live-push-alerts
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "everest-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync expo notifications lockfile"
          git push origin HEAD:everest-live-push-alerts
