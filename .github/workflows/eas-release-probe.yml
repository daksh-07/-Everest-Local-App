name: Everest EAS Release Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eas-release-probe.yml'

permissions:
  contents: write

jobs:
  eas-release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/eas-link-build-probe
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Require Expo authorization
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is not configured."
            exit 2
          fi
      - name: Resolve Expo account
        id: expo
        run: |
          ACCOUNT="$(npx --yes eas-cli@latest whoami | tail -n 1 | tr -d '\r')"
          test -n "$ACCOUNT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Authorized Expo account: $ACCOUNT"
      - name: Official EAS project init/link
        run: |
          npx --yes eas-cli@latest init --account "${{ steps.expo.outputs.account }}" --json --non-interactive | tee eas-init.json
          node - <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const id=app?.expo?.extra?.eas?.projectId;
          if(!id) throw new Error('Official EAS init completed without writing expo.extra.eas.projectId');
          console.log('EAS_PROJECT_ID='+id);
          NODE
      - name: Verify immutable native identity
        run: |
          node - <<'NODE'
          const app=JSON.parse(require('fs').readFileSync('app.json','utf8'));
          if(app.expo.ios.bundleIdentifier!=='com.everestlocal.app') throw new Error('bundle identifier changed');
          if(app.expo.scheme!=='everestlocal') throw new Error('scheme changed');
          NODE
      - name: Commit official EAS linkage to probe branch
        run: |
          if git diff --quiet -- app.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "chore: link Everest Local to official EAS project"
          git push origin HEAD:release/eas-link-build-probe
      - name: Start simplest production iOS EAS build
        run: |
          npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --json | tee eas-build.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('eas-build.json','utf8').trim();
          const value=JSON.parse(raw);
          const row=Array.isArray(value)?value[0]:value;
          const id=row?.id;
          if(!id) throw new Error('EAS build did not return a build ID');
          console.log('EAS_BUILD_ID='+id);
          NODE
