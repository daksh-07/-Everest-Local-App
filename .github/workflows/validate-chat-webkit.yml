name: Validate iPhone Chat WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/messages.tsx'
      - 'app/chat-input-regression.tsx'
      - 'lib/chat-web-runtime.ts'
      - 'lib/visual-viewport.ts'
      - 'scripts/verify-chat-webkit.mjs'
      - 'scripts/verify-chat-layout.mjs'
      - 'lib/chat-layout.ts'
      - 'app/+html.tsx'
      - 'public/chat-layout.css'
      - 'public/index.html'
      - '.github/workflows/validate-chat-webkit.yml'

permissions:
  contents: read

jobs:
  webkit-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Export production-style web build
        env:
          EXPO_PUBLIC_CHAT_WEBKIT_REGRESSION: '1'
        run: npm run build:web
      - name: Install WebKit regression runtime
        run: |
          npm install --no-save playwright@1.55.0 serve@14
          npx playwright install --with-deps webkit
      - name: Serve export
        run: |
          npx serve -s dist -l 4173 > /tmp/everest-chat-serve.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/everest-chat-serve.log
          exit 1
      - name: Verify focused textarea computed styles
        run: node scripts/verify-chat-webkit.mjs
      - name: Verify conversation layout and keyboard viewport transitions
        env:
          EVEREST_QA_BROWSER: webkit
          EVEREST_PREVIEW_URL: http://127.0.0.1:4173
          EVEREST_QA_WIDTHS: '320,390,1280'
          EVEREST_QA_ARTIFACTS: /tmp/everest-chat-layout
        run: node scripts/verify-chat-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-input-webkit-regression
          path: |
            chat-input-webkit-regression.png
            /tmp/everest-chat-layout
          if-no-files-found: ignore
