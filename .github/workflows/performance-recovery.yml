name: Performance recovery
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'scripts/verify-performance-recovery.mjs'
      - 'scripts/verify-guest-recovery-sql.mjs'
      - 'supabase/migrations/20261022120000_restore_public_guest_reads.sql'
      - '.github/workflows/performance-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55436:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build:web && npm run audit && npm run audit:migrations
      - run: npm install --prefix /tmp/sql-tools pg@8.16.3
      - name: Guest RLS and integration contracts
        env:
          PHASE6_DATABASE_URL: postgresql://postgres@127.0.0.1:55436/postgres
          PG_MODULE: /tmp/sql-tools/node_modules/pg/lib/index.js
        run: |
          node scripts/verify-guest-recovery-sql.mjs
          node scripts/verify-release-integration-sql.mjs
      - run: npm install --prefix /tmp/browser-tools playwright@1.64.1
      - run: /tmp/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser recovery regressions
        env:
          PLAYWRIGHT_MODULE: /tmp/browser-tools/node_modules/playwright/index.mjs
          RECOVERY_OUTPUT: /tmp/recovery-browser.json
        run: |
          npm exec --yes --package=serve@14.2.4 -- serve -s dist -l 4173 > /tmp/recovery-server.log 2>&1 &
          export EVEREST_BROWSER_PATH="$(node -e "console.log(require('/tmp/browser-tools/node_modules/playwright').chromium.executablePath())")"
          for attempt in $(seq 1 30); do curl -fsS http://localhost:4173 > /dev/null && break; sleep 1; done
          node scripts/verify-performance-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-browser
          path: /tmp/recovery-browser.json
