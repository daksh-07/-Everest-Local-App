name: Validate Everest Local
# Main validation workflow: keep typecheck/lint/security/build gates authoritative.
# Validation is triggered again after autonomous repairs so the repaired HEAD is authoritative.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-mobile:
    name: Validate mobile app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload TypeScript diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - name: ESLint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload ESLint diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
      - name: Static security/navigation audit
        run: npm run audit
      - name: Migration audit
        run: npm run audit:migrations
      - name: Security invariant tests
        shell: bash
        run: |
          set +e
          npm run test:security 2>&1 | tee security.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Service dispatch regression tests
        run: npm run test:dispatch && node --test tests/service-aware-dispatch-audit.test.mjs
      - name: Business verification tests
        run: npm run test:business-verification
      - name: Complete regression suite
        run: npm test
      - name: Upload security test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-test-diagnostics
          path: security.log
          if-no-files-found: ignore
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Expo web bundle
        run: npm run build:web
  validate-functions:
    name: Validate Supabase functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json --node-modules-dir=auto supabase/functions/*/index.ts
