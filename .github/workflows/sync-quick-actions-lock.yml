name: Sync quick actions lockfile

on:
  push:
    branches:
      - feat/edge-to-edge-home-quick-actions
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lock:
    if: "!contains(github.event.head_commit.message, '[lock-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/edge-to-edge-home-quick-actions
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync quick actions lockfile [lock-sync]"
          git push origin HEAD:feat/edge-to-edge-home-quick-actions
